services:
  main:
    platform: linux/amd64
    image: eesimbench/sample4-medradio-harder-verifier:local
    build:
      context: ..
      dockerfile: tests/Dockerfile
    command: ["sleep", "infinity"]
    tmpfs:
      - /tmp:mode=1777
      - /logs:mode=1777
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
