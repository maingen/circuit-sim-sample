services:
  main:
    platform: linux/amd64
    image: eesimbench/sample-1-zero-if-rf-soc-mid-verifier:local
    build:
      context: ..
      dockerfile: tests/Dockerfile
    command: ["sleep", "infinity"]
    tmpfs:
      - /tmp:mode=1777
      - /logs:mode=1777
      - /artifacts:mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
