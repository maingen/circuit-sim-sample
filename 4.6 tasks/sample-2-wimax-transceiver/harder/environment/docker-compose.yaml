services:
  main:
    platform: linux/amd64
    image: eesimbench/sample2-wimax-agent:local
    build:
      context: ..
      dockerfile: environment/Dockerfile
    command: ["sleep", "infinity"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
