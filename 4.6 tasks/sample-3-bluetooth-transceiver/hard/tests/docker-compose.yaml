services:
  main:
    platform: linux/amd64
    image: eesimbench/sample3-bluetooth-hard-verifier:local
    build:
      context: ..
      dockerfile: tests/Dockerfile
    command: ["sleep", "infinity"]
    network_mode: none
    tmpfs:
      - /tmp:mode=1777
      - /logs:mode=1777
      - /artifacts:mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
