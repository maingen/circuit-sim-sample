schema_version = "1.3"
artifacts = ["/app/submission", "/app/work"]

[task]
name = "maingen/sample5-rf-sampling-receiver-mid"
version = "1.0.1"
description = "Reconstruct the complete SKY130 2.4 GHz RF sampling receiver at mid difficulty."
keywords = ["electrical-engineering", "spice", "ngspice", "sky130", "rf", "transistor-level", "circuit-reconstruction"]

[[task.authors]]
name = "Maingen"
email = "david@maingen.ai"

[metadata]
category = "electrical-engineering"
difficulty = "mid"
harness = "harbor-0.21.0"
simulator = "ngspice-46"
source_identifier = "sample5_rf_sampling_receiver"
status = "reference-replay-calibrated"

[verifier]
timeout_sec = 86400.0
environment_mode = "separate"
user = "verifier"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 86400.0
os = "linux"

[agent]
timeout_sec = 86400.0

[environment]
network_mode = "no-network"
build_timeout_sec = 86400.0
os = "linux"
docker_image = "eesimbench/sample5-mid-agent:local"
cpus = 4
memory_mb = 8192
storage_mb = 16384
