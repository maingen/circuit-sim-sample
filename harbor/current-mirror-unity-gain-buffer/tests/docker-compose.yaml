services:
  main:
    platform: linux/amd64
    image: public.ecr.aws/r9r0c2u2/eesimbench/current-mirror-op-amp-verifier@sha256:7624ab1741fce9c54f22fda27f2cfe801a262b1bbb4c7d017b0406c41932666d
